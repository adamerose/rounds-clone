name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision pinned SDK
        shell: pwsh
        run: ./tools/bootstrap.ps1 -IncludeGodot
      - name: Run all checks
        shell: pwsh
        run: ./tools/checks/run.ps1
