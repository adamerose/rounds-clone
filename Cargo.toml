[workspace]
members = [
    "crates/rounds-sim",
    "crates/rounds-presentation",
    "crates/rounds-network",
    "crates/rounds-server",
    "crates/rounds-client",
    "crates/rounds-automation",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
bevy_ecs = { version = "=0.19.1", default-features = false }
png = "=0.18.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
